name: Discord notifications

on:
  push:
    branches: [main]
  status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'status' && github.event.context == 'Vercel' &&
        contains(fromJSON('["success", "failure", "error"]'), github.event.state))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Always run the reviewed default-branch notifier, never code from the status event's SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Send Discord notification
        env:
          DISCORD_GITHUB_WEBHOOK_URL: ${{ secrets.DISCORD_GITHUB_WEBHOOK_URL }}
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
        run: node scripts/notifications/discord.mjs
