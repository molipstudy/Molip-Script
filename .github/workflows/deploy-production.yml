name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - '.github/workflows/deploy-production.yml'
      - 'scripts/deploy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molip-script-production
  cancel-in-progress: false

jobs:
  deploy:
    # The current private repository cannot use paid branch-protection rules.
    # Only the owner explicitly authorized to publish this project can release main.
    if: github.repository == 'molipstudy/Molip-Script' && github.ref == 'refs/heads/main' && github.actor == 'z1hxn'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_GxTXlMTWjJMRtk566lnonTDB
      VERCEL_PROJECT_ID: prj_PiLtRjOBuQB9KqdwBHRvBpBV8rla
      VERCEL_CLI_VERSION: 65.15.0
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and deployment tool
        run: |
          npm ci
          npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Check code
        run: |
          npm run lint
          node --test tests/*.test.mjs
      - name: Load production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN secret is missing. Register it in GitHub Actions secrets.'; exit 1; }
          vercel pull --yes --environment=production --scope "$VERCEL_ORG_ID"
          vercel project inspect --non-interactive --scope "$VERCEL_ORG_ID"
      # Repository build commands run without the deployment token in their environment.
      - name: Build production assets
        run: vercel build --prod
      - name: Stage the tested production build
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --yes --scope "$VERCEL_ORG_ID")"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module -e '
            const raw = process.env.DEPLOYMENT_URL;
            const url = new URL(raw);
            if (url.protocol !== "https:" || url.origin !== raw || !url.hostname.endsWith(".vercel.app")) process.exit(1);
          '
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify staged page
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          vercel curl / --deployment "$DEPLOYMENT_URL" --scope "$VERCEL_ORG_ID" -- --fail --silent --show-error --output "$RUNNER_TEMP/molip-staged.html"
          node scripts/deploy/check-page.mjs dist/index.html "$RUNNER_TEMP/molip-staged.html"
      - name: Confirm this commit is still current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api repos/molipstudy/Molip-Script/git/ref/heads/main --jq '.object.sha')"
          test "$latest_sha" = "$GITHUB_SHA" || { echo 'A newer main commit exists; this older build will not be promoted.'; exit 1; }
      - name: Publish the verified build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --scope "$VERCEL_ORG_ID"
      - name: Verify production page
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 3 https://script.molip.kro.kr/ --output "$RUNNER_TEMP/molip-production.html"
          node scripts/deploy/check-page.mjs dist/index.html "$RUNNER_TEMP/molip-production.html"
